version: "3.8"

services:
    postgres:
        image: postgres:16-alpine
        container_name: fom_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-fom}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fom}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - fom_network

    bot:
        build: .
        container_name: fom_discord_bot
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${DB_NAME:-fom}
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD}
            DISCORD_TOKEN: ${DISCORD_TOKEN}
            CLIENT_ID: ${CLIENT_ID}
            GUILD_ID: ${GUILD_ID}
        volumes:
            - bot_logs:/usr/src/app/logs
        networks:
            - fom_network

networks:
    fom_network:
        driver: bridge

volumes:
    postgres_data:
    bot_logs:
