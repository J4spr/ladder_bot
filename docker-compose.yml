services:
    postgres:
        image: postgres:16-alpine
        container_name: fom_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-fom}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fom}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - fom_network

    bot:
        image: ghcr.io/j4spr/ladder_bot:main
        container_name: fom_discord_bot
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${DB_NAME:-fom}
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD}
            DISCORD_TOKEN: ${DISCORD_TOKEN}
            CLIENT_ID: ${CLIENT_ID}
            GUILD_ID: ${GUILD_ID}
        volumes:
            - bot_logs:/usr/src/app/logs
            - ./config.json:/usr/src/app/config.json:ro
        # 2. Tell Watchtower to explicitly monitor this container
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        networks:
            - fom_network

    watchtower:
        image: containrrr/watchtower:latest
        container_name: fom_watchtower
        restart: unless-stopped
        volumes:
            # Allows Watchtower to monitor host containers and restart them
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true # Deletes old image layers after updating
            - WATCHTOWER_POLL_INTERVAL=300 # Checks for image updates every 5 minutes (300s)
            - WATCHTOWER_LABEL_ENABLE=true # ONLY updates containers with the watchtower label
            - DOCKER_API_VERSION=1.40

            # UNCOMMENT if your GHCR repository is PRIVATE:
            # - REPO_USER=j4spr
            # - REPO_PASS=${GHCR_PAT}              # GitHub Personal Access Token with 'read:packages' scope
        networks:
            - fom_network

networks:
    fom_network:
        driver: bridge

volumes:
    postgres_data:
    bot_logs:
